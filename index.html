<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SnapSearch</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>SnapSearch</h1>
    <p>Discover images that match your imagination.</p>

    <form id="search-form">

      <label for="search-input">Search for images</label>

      <div class="search-box">
        <input
          id="search-input"
          type="search"
          placeholder="Search images..."
        >

        <button id="search-button" type="submit">
          Search
        </button>
      </div>

    </form>

    <div class="categories">
      <button type="button">Nature</button>
      <button type="button">Animals</button>
      <button type="button">Cities</button>
    </div>
  </header>

  <main>

    <p id="empty-message">
      Search for something to see images here.
    </p>

    <section id="results"></section>

  </main>

  <script src="script.js"></script>

</body>
</html>
